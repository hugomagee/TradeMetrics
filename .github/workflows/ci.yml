name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Verify committed sample data matches its generator
        run: |
          python tools/make_sample_data.py
          git diff --exit-code -- data/samples/

      # Two separate properties. Byte-identical output across runs on THIS
      # machine is the determinism guarantee. The committed artifact is then
      # compared with a floating-point tolerance, because the last bit of a
      # float legitimately differs between CPU architectures and BLAS builds.
      - name: Verify the demo is deterministic and the committed results still match
        run: |
          cp outputs/results.json /tmp/committed.json
          python -m trademetrics.demo
          cp outputs/results.json /tmp/run1.json
          python -m trademetrics.demo
          diff /tmp/run1.json outputs/results.json
          python tools/check_results_match.py /tmp/committed.json /tmp/run1.json

      - name: Verify the report rebuilds
        run: |
          python tools/build_dashboard.py
          test -s trademetrics.html

      - name: Execute the validation notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            analysis/metric_validation.ipynb \
            --output /tmp/metric_validation_ci.ipynb \
            --ExecutePreprocessor.timeout=900
